[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prefixcost"
version = "0.1.0"
description = "Cost attribution for LLM serving with a prefix cache, where what a request costs is a function of the sequence it arrived in."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Srujan Sadineni" }]
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]
vocabularies = ["tiktoken>=0.7"]
evidence = ["playwright>=1.40", "cmarkgfm>=2024.1.14", "matplotlib>=3.7"]

[project.scripts]
prefixcost = "prefixcost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

  <line x1="126" y1="440" x2="874" y2="440" stroke="#9aa2aa" stroke-width="1.2" />
  <rect x="40" y="470" width="172" height="150" rx="6" fill="#fdf0d8" stroke="#e5c583" stroke-width="1.2" />
  <text x="54" y="495" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">per_request</text>
  <text x="54" y="516" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">sums to bill  no</text>
  <text x="54" y="532" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">same order    yes</text>
  <text x="54" y="548" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">fair split    no</text>
  <text x="54" y="564" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve" />
  <text x="54" y="580" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">the usual invoice</text>
  <line x1="126" y1="440" x2="126" y2="466" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="227" y="470" width="172" height="150" rx="6" fill="#fdf0d8" stroke="#e5c583" stroke-width="1.2" />
  <text x="241" y="495" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">marginal</text>
  <text x="241" y="516" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">sums to bill  YES</text>
  <text x="241" y="532" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">same order    no</text>
  <text x="241" y="548" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">fair split    no</text>
  <text x="241" y="564" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve" />
  <text x="241" y="580" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">cache aware, and</text>
  <text x="241" y="596" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">a record of order</text>
  <line x1="313" y1="440" x2="313" y2="466" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="414" y="470" width="172" height="150" rx="6" fill="#fdf0d8" stroke="#e5c583" stroke-width="1.2" />
  <text x="428" y="495" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">equal_split</text>
  <text x="428" y="516" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">sums to bill  no</text>
  <text x="428" y="532" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">same order    yes</text>
  <text x="428" y="548" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">fair split    no</text>
  <text x="428" y="564" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve" />
  <text x="428" y="580" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">one conversation</text>
  <text x="428" y="596" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">pays like a thousand</text>
  <line x1="500" y1="440" x2="500" y2="466" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="601" y="470" width="172" height="150" rx="6" fill="#fdf0d8" stroke="#e5c583" stroke-width="1.2" />
  <text x="615" y="495" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">proportional</text>
  <text x="615" y="516" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">sums to bill  no</text>
  <text x="615" y="532" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">same order    yes</text>
  <text x="615" y="548" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">fair split    no</text>
  <text x="615" y="564" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve" />
  <text x="615" y="580" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">charges for prefixes</text>
  <text x="615" y="596" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">never used</text>
  <line x1="687" y1="440" x2="687" y2="466" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="788" y="470" width="172" height="150" rx="6" fill="#eef4ea" stroke="#b3cba4" stroke-width="1.2" />
  <text x="802" y="495" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">shapley</text>
  <text x="802" y="516" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">sums to bill  yes*</text>
  <text x="802" y="532" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">same order    yes</text>
  <text x="802" y="548" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">fair split    YES</text>
  <text x="802" y="564" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve" />
  <text x="802" y="580" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">* only when the</text>
  <text x="802" y="596" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">cache recomputes</text>
  <text x="802" y="612" fill="#5b636b" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">nothing</text>
  <line x1="874" y1="440" x2="874" y2="466" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="126" y1="622" x2="126" y2="648" stroke="#9aa2aa" stroke-width="1.2" />
  <line x1="313" y1="622" x2="313" y2="648" stroke="#9aa2aa" stroke-width="1.2" />
  <line x1="500" y1="622" x2="500" y2="648" stroke="#9aa2aa" stroke-width="1.2" />
  <line x1="687" y1="622" x2="687" y2="648" stroke="#9aa2aa" stroke-width="1.2" />
  <line x1="874" y1="622" x2="874" y2="648" stroke="#9aa2aa" stroke-width="1.2" />
  <line x1="126" y1="648" x2="874" y2="648" stroke="#9aa2aa" stroke-width="1.2" />
  <line x1="500" y1="648" x2="500" y2="684" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="40" y="688" width="920" height="116" rx="6" fill="#f2f4f6" stroke="#5b636b" stroke-width="1.2" />
  <text x="54" y="713" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Three verdicts, and the order between them is the design decision</text>
  <text x="54" y="734" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">not-an-attribution, exit 2, when the scheme does not sum to what the server spent. It</text>
  <text x="54" y="753" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">outranks the others: an unstable division of the wrong total is not a finding about</text>
  <text x="54" y="772" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">ordering.   order-dependent, exit 1.   attribution-sound, exit 0, and only then.</text>
  <text x="40" y="834" fill="#7a5f16" font-size="10.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">amber: not a division of what the server spent, so whatever it divides, it is not the bill</text>
  <text x="40" y="852" fill="#355c24" font-size="10.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">green: a division of the bill, order independent and fair, whenever the cache recomputes nothing</text>
  <text x="40" y="876" fill="#5b636b" font-size="11" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Exactly one column has an uppercase YES on the first row, and it is not the column that has one on the third. That is the finding.</text>
  <text x="40" y="895" fill="#5b636b" font-size="11" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">The Shapley column is exact rather than sampled: on a tree, a node's cost divides equally among the tenants using it.</text>
  <text x="40" y="918" fill="#9aa2aa" font-size="10" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">tools/render_diagram.py, plain text elements only, no foreignObject</text>
</svg>

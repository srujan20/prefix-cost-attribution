  </defs>
  <text x="40" y="38" fill="#14171a" font-size="16" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Three token counts, five ways to divide one of them, and three properties</text>
  <rect x="40" y="62" width="920" height="100" rx="6" fill="#e8eef5" stroke="#a9bed4" stroke-width="1.2" />
  <text x="54" y="87" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">One deployment, many tenants, and prompts that share their opening tokens</text>
  <text x="54" y="108" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Tenants sharing a system prompt share its tokens. Turns of one conversation share the</text>
  <text x="54" y="127" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">history. So the server sends far more prompt tokens than it ever processes, and the</text>
  <text x="54" y="146" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">difference belongs to nobody in particular. That difference is what has to be divided.</text>
  <text x="40" y="194" fill="#5b636b" font-size="11" font-weight="600" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">counted from the same workload</text>
  <text x="342" y="188" fill="#7a5f16" font-size="11.5" font-weight="700" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">larger</text>
  <text x="342" y="204" fill="#7a5f16" font-size="10" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">by the hit share</text>
  <text x="657" y="188" fill="#355c24" font-size="11.5" font-weight="700" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">larger</text>
  <text x="657" y="204" fill="#355c24" font-size="10" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">by what was recomputed</text>
  <rect x="40" y="216" width="290" height="160" rx="6" fill="#fdf0d8" stroke="#e5c583" stroke-width="1.2" />
  <text x="54" y="241" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">tokens sent</text>
  <text x="54" y="262" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">every prompt token of</text>
  <text x="54" y="281" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">every request, counted</text>
  <text x="54" y="300" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">once per request</text>
  <text x="54" y="319" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start" />
  <text x="54" y="338" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">what a per request bill</text>
  <text x="54" y="357" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">charges for</text>
  <rect x="355" y="216" width="290" height="160" rx="6" fill="#eef4ea" stroke="#b3cba4" stroke-width="1.2" />
  <text x="369" y="241" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">tokens processed</text>
  <text x="369" y="262" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">the misses: what the</text>
  <text x="369" y="281" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">cache did not already</text>
  <text x="369" y="300" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">hold when each request</text>
  <text x="369" y="319" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">arrived</text>
  <text x="369" y="338" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start" />
  <text x="369" y="357" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">what the server spent</text>
  <rect x="670" y="216" width="290" height="160" rx="6" fill="#e8eef5" stroke="#a9bed4" stroke-width="1.2" />
  <text x="684" y="241" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">distinct prefix tokens</text>
  <text x="684" y="262" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">the nodes of the trie of</text>
  <text x="684" y="281" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">every request's tokens</text>
  <text x="684" y="300" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start" />
  <text x="684" y="319" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">what a cache that never</text>
  <text x="684" y="338" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">evicts would process,</text>
  <text x="684" y="357" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">in any arrival order</text>
  <line x1="332" y1="296" x2="353" y2="296" stroke="#e5c583" stroke-width="3" />
  <line x1="647" y1="296" x2="668" y2="296" stroke="#b3cba4" stroke-width="3" stroke-dasharray="5 4" />
  <text x="40" y="404" fill="#5b636b" font-size="11" font-weight="600" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">each scheme divides the middle column</text>

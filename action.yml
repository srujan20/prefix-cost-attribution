name: "prefix cost attribution audit"
description: "Audit how a multi tenant LLM bill divides prefill cost under a prefix cache, and return not-an-attribution rather than a pass when the scheme does not sum to what the server spent"
author: "Srujan Sadineni"
branding:
  icon: "pie-chart"
  color: "red"

# Three exit codes reach the caller, and which one becomes a failed step is the
# whole reason this file exists rather than a bare `run:` line.
#
# Exit 2 means the scheme is not a division of what the server spent, which for
# most teams is the state they are already in on the day they adopt this, and it
# cannot be fixed inside the pull request that first went amber. So
# `not-an-attribution-fails` defaults to false and the step annotates instead.
#
# Exit 1 means the scheme sums to the spend and a tenant's share moves with
# arrival order. `order-dependent-fails` defaults to true, because that verdict
# is a live billing defect rather than a state of the world.
#
# Exit 3 and 4 are always failures, because they mean the audit did not run.

inputs:
  policy:
    description: "Path to the policy file with the workload, capacity, prices and materiality"
    required: false
    default: "configs/policy.yaml"
  scheme:
    description: "Which attribution scheme to audit: per_request, marginal, equal_split, proportional or shapley"
    required: false
    default: ""
  seed:
    description: "Seed for the generated workload"
    required: false
    default: "11"
  orderings:
    description: "How many arrival orders to measure stability over"
    required: false
    default: "12"
  html:
    description: "Optional path for the self contained HTML report"
    required: false
    default: ""
  json:
    description: "Optional path for the machine readable summary"
    required: false
    default: ""
  warn-only:
    description: "Report the verdict and never fail the step"
    required: false
    default: "false"
  not-an-attribution-fails:
    description: "Whether exit 2, the scheme does not sum to the spend, fails the step"
    required: false
    default: "false"
  order-dependent-fails:
    description: "Whether exit 1, a tenant's share moves with arrival order, fails the step"
    required: false
    default: "true"

outputs:
  verdict:
    description: "attribution-sound, order-dependent, or not-an-attribution"
    value: ${{ steps.audit.outputs.verdict }}
  exit-code:
    description: "The audit's own exit code, whatever this action did about it"
    value: ${{ steps.audit.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install the audit
      shell: bash
      # The lean install on purpose. This action needs neither the evidence
      # tooling nor a pretrained vocabulary, and a composite action that pulled a
      # browser into somebody else's workflow would be a good way to never be
      # adopted.
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Run the audit
      id: audit
      shell: bash
      run: |
        set +e
        flags=""
        if [ -n "${{ inputs.scheme }}" ]; then
          flags="$flags --scheme ${{ inputs.scheme }}"
        fi
        if [ -n "${{ inputs.html }}" ]; then
          flags="$flags --html ${{ inputs.html }}"
        fi
        if [ -n "${{ inputs.json }}" ]; then
          flags="$flags --json ${{ inputs.json }}"
        fi
        output=$(python -m prefixcost audit \
          --policy "${{ inputs.policy }}" \
          --seed "${{ inputs.seed }}" \
          --orderings "${{ inputs.orderings }}" \
          $flags 2>&1)
        code=$?
        set -e
        echo "$output"
        verdict=$(printf '%s\n' "$output" | sed -n 's/^verdict: //p' | head -1)
        echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
        echo "exit-code=${code}" >> "$GITHUB_OUTPUT"

        {
          echo "### Prefix cost attribution audit"
          echo
          echo "Verdict: \`${verdict}\`, exit code ${code}."
          echo
          echo '```'
          printf '%s\n' "$output"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "${{ inputs.warn-only }}" = "true" ]; then
          echo "warn-only is set, so this step passes whatever the audit said"
          exit 0
        fi
        if [ "$code" = "2" ] && [ "${{ inputs.not-an-attribution-fails }}" != "true" ]; then
          echo "::warning::this scheme does not sum to what the server spent, so whatever it divides, it is not the bill. That is not a pass"
          exit 0
        fi
        if [ "$code" = "1" ] && [ "${{ inputs.order-dependent-fails }}" != "true" ]; then
          echo "::warning::a tenant's share moves between arrival orders of the same requests by more than the configured materiality"
          exit 0
        fi
        exit $code

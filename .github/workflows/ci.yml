name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests tools experiments benchmark
      - run: ruff format --check src tests tools experiments benchmark

  # Installs without any extra beyond dev, which is the job that catches an
  # optional dependency imported at module scope. pyspark is a supported engine
  # behind an extra and is deliberately absent here: a machine with it installed
  # is exactly the machine that cannot catch that bug.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # fetch-depth: 0, and this line is why a sibling repository had four of
      # five jobs red. actions/checkout clones with depth 1 by default, so
      # `git log` on the runner returns exactly one commit, and
      # tests/test_repo_hygiene.py asserts the history has at least five. The
      # suite was green on every machine that had the history and red on the only
      # machine that did not.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Tests, without the second engine
        run: |
          python -m pytest -q -m "not spark" --junitxml=reports/junit-lean.xml \
            --cov=windowparity --cov-report=json:reports/coverage-lean.json \
            --cov-report=xml:reports/coverage.xml
      - name: Coverage floor for the lean install
        run: |
          python - <<'PY'
          import json, sys
          # Lower than the published figure on purpose. This run cannot reach the
          # Spark engine, so holding it to the full number would mean either
          # deleting a tested module or lying about what ran here.
          floor = 88.0
          covered = json.load(open("reports/coverage-lean.json"))["totals"]["percent_covered"]
          print(f"lean line coverage {covered:.2f}, floor {floor}")
          sys.exit(0 if covered >= floor else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.python-version }}
          path: reports/

  # The second engine, run for real. Ubuntu runners ship a JVM, so there is no
  # reason for the cross engine claim in ADR-005 to rest on my machine.
  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # pyspark publishes an sdist and no wheel, so pip builds it here. An old
      # setuptools fails that build with an AttributeError about install_layout,
      # which reads as a pyspark problem and is a build backend problem, so the
      # backend is upgraded first rather than left to whatever the image shipped.
      - run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,spark]"
      - name: The cross engine tests
        run: python -m pytest -q -m spark
      - name: The full suite, which is where the published coverage comes from
        run: |
          python -m pytest -q --junitxml=reports/junit-full.xml \
            --cov=windowparity --cov-report=json:reports/coverage-full.json
      - name: Coverage floor for the full suite
        run: |
          python - <<'PY'
          import json, sys
          floor = 99.0
          covered = json.load(open("reports/coverage-full.json"))["totals"]["percent_covered"]
          print(f"full line coverage {covered:.2f}, floor {floor}")
          sys.exit(0 if covered >= floor else 1)
          PY

  # The only job that re-measures a published rate, with pinned dependency
  # versions. It needs the spark extra because one of the five experiments is the
  # cross engine one, and that experiment refuses to run on a single engine
  # rather than publishing a disagreement rate of zero and calling it a finding.
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements-receipts.txt
          pip install -e ".[dev,spark]"
      - name: Both suites, so the collector can read the reports
        run: |
          python -m pytest -q -m "not spark" --junitxml=reports/junit-lean.xml \
            --cov=windowparity --cov-report=json:reports/coverage-lean.json
          python -m pytest -q --junitxml=reports/junit-full.xml \
            --cov=windowparity --cov-report=json:reports/coverage-full.json
      - name: Re-run every experiment from scratch
        run: |
          rm -rf docs/experiments
          make experiments
      - name: Re-measure every published figure
        run: python tools/collect_metrics.py --skip-tests --skip-experiments
      - name: Check the documents against the code
        run: python tools/check_numbers.py --strict --summary "$GITHUB_STEP_SUMMARY"
      - name: Publish the awkward table to the job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          metrics = json.load(open("docs/metrics.json"))["metrics"]
          rows = [
              ("what the parity check everybody ships detects", metrics["backfill_detection"]),
              ("what the replay check detects", metrics["replay_detection"]),
              ("requests where serving read a different value", metrics["median_skew_share"]),
              ("requests whose decision changed", metrics["median_decision_flips"]),
              ("logs returning not-checkable without an ingest time",
               metrics["not_checkable_share"]),
              ("logs passing without an ingest time", metrics["passes_without_ingest_time"]),
              ("cross engine disagreement, order independent aggregates",
               metrics["engine_exact_order_independent"]),
              ("cross engine disagreement, order dependent aggregates",
               metrics["engine_exact_order_dependent"]),
              ("exact equality firing on frames one ulp apart", metrics["ulp_exact_alarm"]),
              ("what the point in time replay costs, relative to the offline pass",
               metrics["bench_replay_ratio"]),
          ]
          print("### The numbers this build would rather not publish\n")
          print("| quantity | value |")
          print("| --- | --- |")
          for name, value in rows:
              print(f"| {name} | {value} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-json
          path: |
            docs/experiments/
            docs/metrics.json

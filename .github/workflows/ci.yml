name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests tools experiments benchmark
      - run: ruff format --check src tests tools experiments benchmark

  # Installs without any extra beyond dev, which is the job that catches an
  # optional dependency imported at module scope. tiktoken, Playwright and
  # matplotlib are all deliberately absent here: a machine with them installed is
  # exactly the machine that cannot catch that bug.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # fetch-depth: 0, and this line is why a sibling repository had four of
      # five jobs red. actions/checkout clones with depth 1 by default, so
      # `git log` on the runner returns exactly one commit, and
      # tests/test_repo_hygiene.py asserts the history has at least five. The
      # suite was green on every machine that had the history and red on the only
      # machine that did not.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Tests
        run: |
          python -m pytest -q --junitxml=reports/junit.xml \
            --cov=prefixcost --cov-report=json:reports/coverage.json \
            --cov-report=xml:reports/coverage.xml
      - name: Coverage floor
        run: |
          python - <<'PY'
          import json, sys
          floor = 99.0
          covered = json.load(open("reports/coverage.json"))["totals"]["percent_covered"]
          print(f"line coverage {covered:.2f}, floor {floor}")
          sys.exit(0 if covered >= floor else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.python-version }}
          path: reports/

  # The tool run as a consumer would run it, through its own composite action,
  # which is the only job that would notice `action.yml` drifting from the CLI it
  # wraps. Both non zero verdicts are exercised on purpose: a step that only ever
  # sees exit 0 is not testing an exit code.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: fair
        with:
          scheme: shapley
          orderings: "4"
          not-an-attribution-fails: "false"
      - name: The fair split at the shipped capacity is not a bill
        run: |
          echo "verdict ${{ steps.fair.outputs.verdict }}, exit ${{ steps.fair.outputs.exit-code }}"
          test "${{ steps.fair.outputs.verdict }}" = "not-an-attribution"
      - uses: ./
        id: marginal
        with:
          scheme: marginal
          orderings: "4"
          order-dependent-fails: "false"
      - name: The efficient split is a bill, and moves with arrival order
        run: |
          echo "verdict ${{ steps.marginal.outputs.verdict }}"
          test "${{ steps.marginal.outputs.verdict }}" = "order-dependent"

  # The only job that re-measures a published figure, with pinned dependency
  # versions. The test suite asserts identities and properties so it runs against
  # whatever resolves on three Pythons; a published rate is worth nothing if it
  # moves with a minor bump, so it is measured once, here, against exact pins.
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements-receipts.txt
          pip install -e ".[dev]"
      - name: The suite, so the collector can read its reports
        run: |
          python -m pytest -q --junitxml=reports/junit.xml \
            --cov=prefixcost --cov-report=json:reports/coverage.json
      - name: Re-run every experiment from scratch
        run: |
          rm -rf docs/experiments
          make experiments
      - name: Re-measure every published figure
        run: python tools/collect_metrics.py --skip-tests --skip-experiments
      - name: Check the documents against the code
        run: python tools/check_numbers.py --strict --summary "$GITHUB_STEP_SUMMARY"
      - name: Publish the awkward table to the job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          metrics = json.load(open("docs/metrics.json"))["metrics"]
          rows = [
              ("what a per request bill collects, against the spend",
               metrics["per_request_collects"]),
              ("the same bill against a fair share of prefill",
               metrics["per_request_vs_fair_prefill"]),
              ("worst single tenant on that bill", metrics["worst_per_request_tenant_ratio"]),
              ("median tenant spread under the only efficient scheme",
               metrics["marginal_median_spread"]),
              ("worst tenant, across arrival orders of the same requests",
               metrics["marginal_worst_spread"]),
              ("family replays where the first arriver paid the most",
               metrics["first_arriver_marginal"]),
              ("what chance alone would give", metrics["first_arriver_chance"]),
              ("what the fair split collects, against the spend", metrics["fair_collects"]),
              ("grid cells where some scheme had all three properties",
               metrics["grid_all_three"]),
              ("of those, cells where the cache recomputed",
               metrics["grid_all_three_when_recomputing"]),
          ]
          print("### The numbers this build would rather not publish\n")
          print("| quantity | value |")
          print("| --- | --- |")
          for name, value in rows:
              print(f"| {name} | {value} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-json
          path: |
            docs/experiments/
            docs/metrics.json
